version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mycompany-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mycompany}
      MYSQL_USER: ${MYSQL_USER:-mycompany}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: mycompany-api
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-mycompany}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mycompany}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    networks:
      - default
      - mycompany-net
      - zlabs-nginx-proxy

  frontend:
    build: ./frontend
    container_name: mycompany-web
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./releases:/usr/share/nginx/html/releases
    depends_on:
      - backend
    networks:
      - default
      - mycompany-net
      - zlabs-nginx-proxy

volumes:
  mysql_data:

networks:
  mycompany-net:
    external: true
  zlabs-nginx-proxy:
    external: true
