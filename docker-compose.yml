version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mycompany-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mycompany
      MYSQL_USER: mycompany
      MYSQL_PASSWORD: mycompany123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: mycompany-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: mycompany
      DB_PASSWORD: mycompany123
      DB_NAME: mycompany
      JWT_SECRET: zlabs-mycompany-secret-key-2026
    depends_on:
      - mysql

volumes:
  mysql_data:
